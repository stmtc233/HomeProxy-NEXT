name: i18n

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: i18n-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  translation-coverage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source tree
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      # Every template string must have a non-fuzzy, non-empty zh_Hans
      # translation; the handful of technical tokens that stay as-is are
      # listed in tests/i18n-ignore.txt. A missing translation fails the run:
      # the report is also written to the job summary.
      - name: Check zh_Hans translation coverage
        run: python3 tests/i18n-coverage.py --fail-below 100

      # The form snapshots and the ucode suite run in test.yml.
      - name: Syntax checks (shell / javascript)
        run: |
          set -e
          # init.d and the runtime scripts are /bin/sh on the router and must
          # stay POSIX, so they are checked with sh. build-pkg.sh declares
          # #!/bin/bash and is invoked with bash by build.yml; checking it with
          # sh (dash on the runner) rejects its own mapfile/process-substitution.
          for f in \
            root/etc/init.d/homeproxy \
            root/etc/homeproxy/scripts/*.sh \
            tests/*.sh tests/ucode/*.sh tests/ci/*.sh; do
            [ -f "$f" ] || continue
            sh -n "$f"
          done
          for f in .github/build-pkg.sh .github/update-geodata.sh; do
            [ -f "$f" ] || continue
            bash -n "$f"
          done
          for f in htdocs/luci-static/resources/homeproxy.js \
            htdocs/luci-static/resources/view/homeproxy/*.js \
            htdocs/luci-static/resources/homeproxy/client/*.js \
            tests/luci-form-snapshot.js tests/frontend-*.js; do
            [ -f "$f" ] || continue
            node --check "$f"
          done
          echo "syntax checks passed"
